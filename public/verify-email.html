<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naira Luck — подтверждение почты</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui;margin:0;min-height:100vh;background:radial-gradient(circle at top,#49724c,#14291d 65%);color:#f8eccc}main{max-width:520px;margin:7vh auto;padding:24px;background:#183122;border:1px solid #cca95b;border-radius:18px;box-shadow:0 18px 40px #0008}h1{font-size:24px}input,button{font:inherit;border-radius:9px;padding:11px;width:100%;margin:6px 0}input{background:#f9f0d8;color:#201b12;border:0}button{background:#efb954;color:#231b0d;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.muted{font-size:13px;opacity:.8}a{color:#f9c96a}.error{color:#ffb3a3;min-height:1.4em}.hidden{display:none}
</style></head><body><main><h1>Naira Luck · почта</h1><p class="muted">Подтверждение адреса. Вход — только по email и паролю. Не отправляйте пароль или код в чат.</p>
<div><button type="button" id="newTab">Новый аккаунт</button><button type="button" id="oldTab">Уже есть аккаунт</button></div>
<form id="newForm"><h2>Регистрация</h2><input type="email" name="email" autocomplete="email" placeholder="Email" required><input type="password" name="password" minlength="10" autocomplete="new-password" placeholder="Пароль (от 10 символов)" required><input name="username" maxlength="32" placeholder="Имя (необязательно)"><input name="referralCode" placeholder="Реферальный код (необязательно)"><button>Отправить код</button></form>
<form id="oldForm" class="hidden"><h2>Подтвердить старый аккаунт</h2><input type="email" name="email" autocomplete="email" placeholder="Прежний email" required><input type="password" name="password" autocomplete="current-password" placeholder="Прежний пароль" required><button>Отправить код</button></form>
<form id="codeForm" class="hidden"><h2>Код из письма</h2><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="Шесть цифр" required><button>Подтвердить почту</button></form><p id="status" role="status" class="error"></p><a href="/">Вернуться к входу</a></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let kind='new',email='',challengeId='';const status=s=>{$('status').textContent=s};
$('newTab').onclick=()=>{kind='new';$('newForm').classList.remove('hidden');$('oldForm').classList.add('hidden');$('codeForm').classList.add('hidden');status('')};
$('oldTab').onclick=()=>{kind='old';$('oldForm').classList.remove('hidden');$('newForm').classList.add('hidden');$('codeForm').classList.add('hidden');status('')};
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Запрос не выполнен');return d}
$('newForm').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{email=f.elements.email.value.trim().toLowerCase();const d=await post('/api/auth/register',{email,password:f.elements.password.value,username:f.elements.username.value,referralCode:f.elements.referralCode.value});if(!d.requiresVerification)throw Error('Регистрация по коду пока не включена на сервере');f.elements.password.value='';$('codeForm').classList.remove('hidden');status(d.message||'Введите код из письма')}catch(x){status(x.message)}finally{b.disabled=false}};
$('oldForm').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{email=f.elements.email.value.trim().toLowerCase();const d=await post('/api/auth/legacy-email/start',{email,password:f.elements.password.value});challengeId=d.challengeId;f.elements.password.value='';$('codeForm').classList.remove('hidden');status(d.message||'Если адрес и пароль верны, письмо отправлено')}catch(x){status(x.message)}finally{b.disabled=false}};
$('codeForm').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{const data=kind==='new'?{email,code:f.elements.code.value}:{challengeId,code:f.elements.code.value};const d=await post(kind==='new'?'/api/auth/verify-email':'/api/auth/legacy-email/confirm',data);status(d.message||'Почта подтверждена. Вернитесь к входу');f.classList.add('hidden')}catch(x){status(x.message)}finally{b.disabled=false}};
const ref=new URLSearchParams(location.search).get('ref');if(ref)$('newForm').elements.referralCode.value=ref;
})();
</script></body></html>
